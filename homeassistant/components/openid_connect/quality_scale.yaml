rules:
  # Bronze
  action-setup:
    status: exempt
    comment: There are no custom actions.
  appropriate-polling:
    status: exempt
    comment: The integration exposes no entities and does not poll; the auth engine validates the IdP during sign-in.
  brands:
    status: exempt
    comment: This generic identity provider integration has no brand asset.
  common-modules:
    status: exempt
    comment: The integration has no entity platforms or shared runtime modules.
  config-flow-test-coverage: done
  config-flow: done
  dependency-transparency:
