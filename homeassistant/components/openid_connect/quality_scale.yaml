    comment: The integration has no entities.
  runtime-data:
    status: exempt
    comment: The integration stores no runtime data.
  test-before-configure: done
  test-before-setup:
    status: exempt
    comment: The auth engine verifies the IdP when a sign-in starts.
  unique-config-entry: done

